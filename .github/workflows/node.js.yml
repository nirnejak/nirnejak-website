# Builds the Next.js app with Bun, then runs lint and format checks.
# https://bun.sh/guides/runtime/cicd

name: Next.js Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      # next build and tsc run on Node, so pin it to the same version as
      # local development rather than whatever the runner image ships.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run type-check
      - run: bun run build
      # - run: bun test
